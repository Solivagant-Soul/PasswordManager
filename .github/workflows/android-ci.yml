name: android-ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # T04：全模块构建 + lint + 全部 JVM 单测
      - name: Build & Verify
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :core:test :domain:test :data:testDebugUnitTest :platform:testDebugUnitTest
